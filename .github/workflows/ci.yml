name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 67/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run ruff
        run: |
          python -m ruff check .
      - name: Run tests
        run: |
          pytest -q
      - name: Run mypy
        run: |
          mypy --ignore-missing-imports .
